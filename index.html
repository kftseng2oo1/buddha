<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>阿拉燈 · 佛法心靈導師</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0e0c08;
  --ink2: #1a1710;
  --ink3: #252118;
  --gold: #c8a84b;
  --gold2: #e4c97a;
  --gold3: #f5e6b8;
  --gold-dim: #7a6530;
  --cream: #f0e8d0;
  --cream2: #e8dfc4;
  --crimson: #8b2020;
  --crimson2: #a33030;
  --text: #d4c89a;
  --text2: #b0a070;
  --text3: #7a6e50;
  --bubble-ai: rgba(30,26,18,0.95);
  --bubble-user: rgba(90,60,20,0.5);
  --border: rgba(200,168,75,0.2);
  --border2: rgba(200,168,75,0.08);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body {
  height: 100%;
  background: var(--ink);
  color: var(--text);
  font-family: 'Noto Serif TC', serif;
  overflow: hidden;
}

/* ═══ 背景蓮花紋 ═══ */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 40% at 50% 0%, rgba(200,168,75,0.06) 0%, transparent 70%),
    radial-gradient(ellipse 80% 60% at 50% 100%, rgba(139,32,32,0.08) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

/* SVG 蓮花水印 */
#lotus-bg {
  position: fixed;
  bottom: -10%;
  left: 50%;
  transform: translateX(-50%);
  width: 380px;
  height: 380px;
  opacity: 0.035;
  pointer-events: none;
  z-index: 0;
  animation: lotus-breathe 8s ease-in-out infinite;
}
@keyframes lotus-breathe {
  0%,100% { opacity:0.035; transform:translateX(-50%) scale(1); }
  50%      { opacity:0.055; transform:translateX(-50%) scale(1.03); }
}

/* ═══ 佈局 ═══ */
#app {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  height: 100%;
  height: 100dvh;
  max-width: 600px;
  margin: 0 auto;
}

/* ═══ 頂部 Header ═══ */
#header {
  flex-shrink: 0;
  padding: env(safe-area-inset-top, 0px) 20px 0;
  background: linear-gradient(180deg, rgba(14,12,8,1) 0%, rgba(14,12,8,0.9) 80%, transparent 100%);
  position: relative;
  z-index: 10;
}

.header-inner {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 0 12px;
  border-bottom: 1px solid var(--border);
}

.avatar-wrap {
  position: relative;
  flex-shrink: 0;
}

.avatar {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #2a2010, #0e0c08);
  border: 1.5px solid var(--gold-dim);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  position: relative;
  overflow: hidden;
}
.avatar::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 30%, rgba(200,168,75,0.15), transparent 60%);
}

.avatar-halo {
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  border: 1px solid rgba(200,168,75,0.3);
  animation: halo-pulse 3s ease-in-out infinite;
}
@keyframes halo-pulse {
  0%,100% { opacity:0.3; transform:scale(1); }
  50%      { opacity:0.7; transform:scale(1.05); }
}

.header-info { flex: 1; min-width: 0; }

.header-title {
  font-family: 'Ma Shan Zheng', serif;
  font-size: 20px;
  color: var(--gold2);
  letter-spacing: 3px;
  line-height: 1.2;
}

.header-sub {
  font-size: 11px;
  color: var(--text3);
  letter-spacing: 2px;
  margin-top: 3px;
}

.header-actions {
  display: flex;
  gap: 8px;
}

.icon-btn {
  width: 36px;
  height: 36px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: rgba(255,255,255,0.03);
  color: var(--text2);
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
}
.icon-btn:active { background: rgba(200,168,75,0.1); color: var(--gold); }

/* ═══ 每日法語橫幅 ═══ */
#daily-dharma {
  flex-shrink: 0;
  margin: 10px 16px;
  padding: 10px 16px;
  background: linear-gradient(135deg, rgba(200,168,75,0.08), rgba(200,168,75,0.04));
  border: 1px solid var(--border);
  border-radius: 10px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  cursor: pointer;
  transition: background 0.2s;
}
#daily-dharma:active { background: rgba(200,168,75,0.12); }
.dharma-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
.dharma-text { flex: 1; }
.dharma-label { font-size: 10px; color: var(--gold-dim); letter-spacing: 2px; margin-bottom: 3px; }
.dharma-quote { font-size: 13px; color: var(--cream2); line-height: 1.6; }
.dharma-source { font-size: 10px; color: var(--text3); margin-top: 3px; }

/* ═══ 訊息區 ═══ */
#chat-scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 8px 16px 16px;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}
#chat-scroll::-webkit-scrollbar { width: 3px; }
#chat-scroll::-webkit-scrollbar-track { background: transparent; }
#chat-scroll::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 2px; }

/* ═══ 泡泡 ═══ */
.msg-row {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
  animation: fadeUp 0.35s ease forwards;
}
@keyframes fadeUp {
  from { opacity:0; transform:translateY(10px); }
  to   { opacity:1; transform:translateY(0); }
}

.msg-row.user { flex-direction: row-reverse; }

.msg-avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  border: 1px solid var(--border);
  background: var(--ink2);
  align-self: flex-end;
}

.bubble {
  max-width: calc(100% - 60px);
  padding: 12px 16px;
  border-radius: 16px;
  font-size: 15px;
  line-height: 1.8;
  position: relative;
}

.bubble.ai {
  background: var(--bubble-ai);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
  color: var(--cream);
}

.bubble.user {
  background: var(--bubble-user);
  border: 1px solid rgba(200,168,75,0.25);
  border-bottom-right-radius: 4px;
  color: var(--cream2);
}

/* AI 回應中的清單 */
.bubble.ai .ai-list {
  margin: 8px 0 8px 4px;
  padding-left: 18px;
  color: var(--cream2);
}
.bubble.ai .ai-list li {
  line-height: 1.9;
  margin-bottom: 2px;
  padding-left: 2px;
}
.bubble.ai ol.ai-list { list-style: decimal; }
.bubble.ai ul.ai-list { list-style: disc; }
.bubble.ai .sutra-cite {
  display: block;
  margin: 10px 0;
  padding: 8px 12px;
  border-left: 2px solid var(--gold-dim);
  background: rgba(200,168,75,0.06);
  border-radius: 0 8px 8px 0;
  font-size: 13px;
  color: var(--gold3);
  font-style: italic;
}
.bubble.ai .sutra-source {
  font-size: 11px;
  color: var(--text3);
  text-align: right;
  margin-top: 4px;
  font-style: normal;
}
.bubble.ai .disclaimer {
  display: block;
  margin-top: 10px;
  font-size: 11px;
  color: var(--text3);
  border-top: 1px solid var(--border2);
  padding-top: 8px;
}

/* ═══ 思考動畫 ═══ */
.thinking-row {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
  align-items: flex-end;
}
.thinking-bubble {
  background: var(--bubble-ai);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
  border-radius: 16px;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.thinking-label {
  font-size: 12px;
  color: var(--text3);
  letter-spacing: 1px;
}
.dots {
  display: flex;
  gap: 5px;
}
.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--gold-dim);
  animation: dot-pulse 1.4s ease-in-out infinite;
}
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes dot-pulse {
  0%,80%,100% { transform:scale(0.6); opacity:0.3; }
  40%          { transform:scale(1); opacity:1; }
}

/* ═══ 快速追問按鈕 ═══ */
#quick-btns {
  flex-shrink: 0;
  padding: 0 16px 10px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  display: none;
  gap: 8px;
  scrollbar-width: none;
}
#quick-btns::-webkit-scrollbar { display: none; }
#quick-btns.show { display: flex; }

.qbtn {
  flex-shrink: 0;
  padding: 7px 13px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: rgba(200,168,75,0.06);
  color: var(--text2);
  font-size: 12px;
  font-family: 'Noto Serif TC', serif;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}
.qbtn:active { background: rgba(200,168,75,0.2); color: var(--gold2); border-color: var(--gold-dim); }

/* ═══ 輸入區 ═══ */
#input-area {
  flex-shrink: 0;
  padding: 10px 16px;
  padding-bottom: max(env(safe-area-inset-bottom, 0px), 10px);
  background: linear-gradient(0deg, rgba(14,12,8,1) 60%, transparent 100%);
  border-top: 1px solid var(--border2);
}

.input-row {
  display: flex;
  gap: 10px;
  align-items: flex-end;
}

#user-input {
  flex: 1;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 11px 16px;
  color: var(--cream);
  font-family: 'Noto Serif TC', serif;
  font-size: 15px;
  resize: none;
  outline: none;
  line-height: 1.5;
  max-height: 120px;
  overflow-y: auto;
  transition: border-color 0.2s;
  -webkit-appearance: none;
}
#user-input:focus { border-color: var(--gold-dim); }
#user-input::placeholder { color: var(--text3); }

#send-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--gold-dim), var(--gold));
  border: none;
  color: var(--ink);
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
  box-shadow: 0 2px 12px rgba(200,168,75,0.2);
}
#send-btn:active { transform: scale(0.92); }
#send-btn:disabled { opacity: 0.4; cursor: default; }

/* ═══ 設定 Modal ═══ */
#modal-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 100;
  backdrop-filter: blur(4px);
  animation: fadeIn 0.2s ease;
}
#modal-bg.show { display: flex; align-items: flex-end; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }

#modal {
  width: 100%;
  max-height: 80vh;
  background: var(--ink2);
  border-top: 1px solid var(--border);
  border-radius: 20px 20px 0 0;
  padding: 20px;
  padding-bottom: max(env(safe-area-inset-bottom, 20px), 20px);
  overflow-y: auto;
  animation: slideUp 0.3s ease;
}
@keyframes slideUp { from{transform:translateY(30px)} to{transform:translateY(0)} }

.modal-handle {
  width: 36px;
  height: 4px;
  background: var(--text3);
  border-radius: 2px;
  margin: 0 auto 20px;
}
.modal-title {
  font-family: 'Ma Shan Zheng', serif;
  font-size: 18px;
  color: var(--gold2);
  letter-spacing: 2px;
  margin-bottom: 20px;
  text-align: center;
}
.setting-group { margin-bottom: 20px; }
.setting-label {
  font-size: 11px;
  color: var(--text3);
  letter-spacing: 2px;
  margin-bottom: 8px;
}
.setting-input {
  width: 100%;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  color: var(--cream);
  font-family: 'Noto Serif TC', serif;
  font-size: 14px;
  outline: none;
  -webkit-appearance: none;
}
.setting-input:focus { border-color: var(--gold-dim); }

.master-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.master-chip {
  padding: 7px 14px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: transparent;
  color: var(--text2);
  font-size: 13px;
  font-family: 'Noto Serif TC', serif;
  cursor: pointer;
  transition: all 0.2s;
}
.master-chip.active {
  background: rgba(200,168,75,0.15);
  border-color: var(--gold-dim);
  color: var(--gold2);
}

.modal-save-btn {
  width: 100%;
  padding: 13px;
  background: linear-gradient(135deg, var(--gold-dim), var(--gold));
  border: none;
  border-radius: 12px;
  color: var(--ink);
  font-family: 'Ma Shan Zheng', serif;
  font-size: 16px;
  letter-spacing: 2px;
  cursor: pointer;
  margin-top: 10px;
}

.modal-close-area {
  position: fixed;
  inset: 0;
  z-index: -1;
}

/* ═══ 歡迎畫面（由 JS renderWelcome() 動態產生，僅保留共用的 tag 樣式）═══ */
.welcome-tag {
  padding: 8px 16px;
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 13px;
  color: var(--text2);
  cursor: pointer;
  transition: all 0.2s;
  user-select: none;
}
.welcome-tag:active { background: rgba(200,168,75,0.15); color:var(--gold2); }
</style>
</head>
<body>

<!-- 蓮花背景 SVG -->
<svg id="lotus-bg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g fill="#c8a84b">
    <!-- 八片蓮瓣 -->
    <ellipse cx="100" cy="60" rx="12" ry="38" opacity="0.8"/>
    <ellipse cx="127" cy="73" rx="12" ry="38" transform="rotate(45 127 73)" opacity="0.8"/>
    <ellipse cx="140" cy="100" rx="12" ry="38" transform="rotate(90 140 100)" opacity="0.8"/>
    <ellipse cx="127" cy="127" rx="12" ry="38" transform="rotate(135 127 127)" opacity="0.8"/>
    <ellipse cx="100" cy="140" rx="12" ry="38" transform="rotate(180 100 140)" opacity="0.8"/>
    <ellipse cx="73" cy="127" rx="12" ry="38" transform="rotate(225 73 127)" opacity="0.8"/>
    <ellipse cx="60" cy="100" rx="12" ry="38" transform="rotate(270 60 100)" opacity="0.8"/>
    <ellipse cx="73" cy="73" rx="12" ry="38" transform="rotate(315 73 73)" opacity="0.8"/>
    <!-- 花心 -->
    <circle cx="100" cy="100" r="18"/>
    <circle cx="100" cy="100" r="10" fill="#0e0c08"/>
    <!-- 外圈 -->
    <circle cx="100" cy="100" r="55" stroke="#c8a84b" stroke-width="1" fill="none" opacity="0.5"/>
    <circle cx="100" cy="100" r="70" stroke="#c8a84b" stroke-width="0.5" fill="none" opacity="0.3"/>
  </g>
</svg>

<div id="app">
  <!-- Header -->
  <div id="header">
    <div class="header-inner">
      <div class="avatar-wrap">
        <div class="avatar-halo"></div>
        <div class="avatar">🪔</div>
      </div>
      <div class="header-info">
        <div class="header-title" id="master-name-display">阿拉燈導師</div>
        <div class="header-sub" id="master-sub-display">以佛法智慧 · 引導修行</div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="clear-btn" title="清除對話">🗑</button>
        <button class="icon-btn" id="setting-btn" title="設定">⚙️</button>
      </div>
    </div>
  </div>

  <!-- 每日法語 -->
  <div id="daily-dharma">
    <div class="dharma-icon">🕯</div>
    <div class="dharma-text">
      <div class="dharma-label">今日法語</div>
      <div class="dharma-quote" id="daily-quote">正在點亮油燈...</div>
      <div class="dharma-source" id="daily-source"></div>
    </div>
  </div>

  <!-- 對話滾動區 -->
  <div id="chat-scroll">
  </div>

  <!-- 快速追問 -->
  <div id="quick-btns">
    <button class="qbtn" onclick="quickSend('可以引用相關經典嗎？')">📖 引用經典</button>
    <button class="qbtn" onclick="quickSend('有什麼具體的修行方法？')">🧘 修行方法</button>
    <button class="qbtn" onclick="quickSend('可以再說淺白一點嗎？')">💬 說淺白些</button>
    <button class="qbtn" onclick="quickSend('這與我的日常生活有什麼關係？')">🌱 日常應用</button>
    <button class="qbtn" onclick="quickSend('如何持續保持這樣的心態？')">🔮 持續修持</button>
  </div>

  <!-- 輸入區 -->
  <div id="input-area">
    <div class="input-row">
      <textarea id="user-input" placeholder="請問導師…" rows="1"></textarea>
      <button id="send-btn">🪔</button>
    </div>
  </div>
</div>

<!-- 設定 Modal -->
<div id="modal-bg">
  <div class="modal-close-area" id="modal-close-area"></div>
  <div id="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">⚙ 道場設定</div>

    <div class="setting-group">
      <div class="setting-label">选择上师 / 法门</div>
      <div class="master-chips" id="master-chips">
        <button class="master-chip active" data-key="general">🪔 通用佛法</button>
        <button class="master-chip" data-key="theravada">🌿 南傳上座部</button>
        <button class="master-chip" data-key="zen">🎋 禪宗</button>
        <button class="master-chip" data-key="pureland">📿 淨土宗</button>
        <button class="master-chip" data-key="tibetan">🔔 藏傳佛教</button>
        <button class="master-chip" data-key="shengyen">🖌 聖嚴法師</button>
        <button class="master-chip" data-key="hsuan">📚 星雲大師</button>
        <button class="master-chip" data-key="custom">✏️ 自訂上師</button>
      </div>
    </div>

    <div class="setting-group" id="custom-input-group" style="display:none">
      <div class="setting-label">自訂上師名稱</div>
      <input class="setting-input" id="custom-master-input" placeholder="例：證嚴法師、達賴喇嘛…" type="text">
    </div>

    <div class="setting-group">
      <div class="setting-label">Worker URL</div>
      <input class="setting-input" id="worker-url-input"
        value="https://twinklehub.kftseng2oo1.workers.dev"
        type="url" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>

    <div class="setting-group">
      <div class="setting-label">回應風格</div>
      <div class="master-chips" id="style-chips">
        <button class="master-chip active" data-style="gentle">溫柔慈悲</button>
        <button class="master-chip" data-style="strict">嚴謹莊重</button>
        <button class="master-chip" data-style="poetic">詩意禪意</button>
        <button class="master-chip" data-style="practical">實用務實</button>
      </div>
    </div>

    <button class="modal-save-btn" id="save-btn">💾 儲存設定</button>
  </div>
</div>

<script>
// ════════════════════════════════════════════════
//  設定管理
// ════════════════════════════════════════════════
const DEFAULTS = {
  workerUrl: 'https://twinklehub.kftseng2oo1.workers.dev',
  master: 'general',
  customMaster: '',
  style: 'gentle'
};

let cfg = Object.assign({}, DEFAULTS, loadCfg());
let chatHistory = [];
let isTyping = false;

function loadCfg() {
  try { return JSON.parse(localStorage.getItem('buddha_cfg') || '{}'); } catch(e) { return {}; }
}
function saveCfg() {
  localStorage.setItem('buddha_cfg', JSON.stringify(cfg));
}

// ════════════════════════════════════════════════
//  上師資料
// ════════════════════════════════════════════════
const MASTERS = {
  general: {

function formatAIText(rawText) {
  // 逐行處理，避免換行替換破壞區塊結構
  const lines = rawText.split('\n');
  const out = [];
  let listType = null; // 'ul' | 'ol' | null
  let listBuf = [];

  function flushList() {
    if (!listType) return;
    const tag = listType;
    out.push(`<${tag} class="ai-list">${listBuf.map(li => `<li>${li}</li>`).join('')}</${tag}>`);
    listBuf = [];
    listType = null;
  }

  lines.forEach(line => {
    // 典籍引用 > ...──出處
    const citeM = line.match(/^>\s*(.+)$/);
    if (citeM) {
      flushList();
      const parts = citeM[1].trim().split('──');
      const quote = inlineFormat(parts[0].trim());
      const src   = parts[1] ? parts[1].trim() : '';
      out.push(`<span class="sutra-cite">${quote}${src ? `<span class="sutra-source">── ${escHtml(src)}</span>` : ''}</span>`);
      return;
    }
    // 無序清單 * / - / •
    const ulM = line.match(/^[\*\-•]\s+(.+)$/);
    if (ulM) {
      if (listType === 'ol') flushList();
      listType = 'ul';
      listBuf.push(inlineFormat(ulM[1]));
      return;
    }
    // 有序清單 1. / 1）
    const olM = line.match(/^\d+[.）]\s+(.+)$/);
    if (olM) {
      if (listType === 'ul') flushList();
      listType = 'ol';
      listBuf.push(inlineFormat(olM[1]));
      return;
    }
    // 一般行
    flushList();
    out.push(line === '' ? '<br>' : inlineFormat(line));
  });
  flushList();

  return out.join('\n').replace(/\n(<br>)+\n/g, '<br>').replace(/\n/g, '<br>');
}

// 行內格式：先處理 Markdown 再 escHtml，順序正確不互相干擾
function inlineFormat(s) {
  // 1. 先抽出粗體/斜體標記（保留原始符號位置）
  // 2. escHtml 處理特殊字元
  // 3. 再把標記換回 HTML tag
  const BOLD   = '\x00B\x00';
  const ITALIC = '\x00I\x00';
  const BOLDEND   = '\x00/B\x00';
  const ITALICEND = '\x00/I\x00';

  s = s
    .replace(/\*\*(.*?)\*\*/g, BOLD + '$1' + BOLDEND)
    .replace(/\*(.*?)\*/g,     ITALIC + '$1' + ITALICEND);

  s = escHtml(s);

  s = s
    .replace(new RegExp(escRegex(BOLD), 'g'),      '<strong>')
    .replace(new RegExp(escRegex(BOLDEND), 'g'),   '</strong>')
    .replace(new RegExp(escRegex(ITALIC), 'g'),    '<em>')
    .replace(new RegExp(escRegex(ITALICEND), 'g'), '</em>');

  return s;
}

function escRegex(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ════════════════════════════════════════════════
//  API 呼叫 (twinklehub worker v8.1)
// ════════════════════════════════════════════════
// 最多保留幾則對話（user+assistant 各算1，共保留最近 MAX_HISTORY 則）
const MAX_HISTORY = 14;

async function callWorker(userMsg) {
  const master = MASTERS[cfg.master] || MASTERS.general;
  const styleNote = STYLES[cfg.style] || '';
  const systemPrompt = master.system + '\n\n' + styleNote;

  // 先暫存，成功才正式 push（避免失敗後歷史髒掉）
  const historySnap = chatHistory.slice(-MAX_HISTORY).concat([{ role: 'user', content: userMsg }]);

  const payload = {
    model: 'claude-sonnet-4-20250514',
    max_tokens: 1000,
    system: systemPrompt,
    messages: historySnap
  };

  const workerUrl = cfg.workerUrl.replace(/\/$/, '');
  // twinklehub v8.2 的 Claude 路由
  const endpoint = workerUrl + '/claude';

  const res = await fetch(endpoint, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'anthropic-version': '2023-06-01'
    },
    body: JSON.stringify(payload)
  });

  if (!res.ok) {
    const err = await res.text();
    throw new Error('Worker 回應錯誤 ' + res.status + ': ' + err.slice(0, 200));
  }

  const data = await res.json();
  const reply = data.content?.[0]?.text || '（未收到回應）';

  // 成功才寫入歷史，並截斷
  chatHistory.push({ role: 'user', content: userMsg });
  chatHistory.push({ role: 'assistant', content: reply });
  if (chatHistory.length > MAX_HISTORY) {
    chatHistory = chatHistory.slice(chatHistory.length - MAX_HISTORY);
  }

  return reply;
}

// ════════════════════════════════════════════════
//  發送訊息
// ════════════════════════════════════════════════
async function sendMessage(text) {
  text = text.trim();
  if (!text || isTyping) return;

  isTyping = true;
  const sendBtn = document.getElementById('send-btn');
  const inputEl = document.getElementById('user-input');
  sendBtn.disabled = true;

  // 清空輸入框（成功路徑）
  inputEl.value = '';
  inputEl.style.height = 'auto';

  const userRow = addUserMsg(text);   // 保留 DOM 參考
  const thinking = addThinking();

  try {
    const reply = await callWorker(text);
    thinking.remove();
    addAIMsg(reply);
  } catch (err) {
    thinking.remove();
    // 失敗：移除用戶泡泡 + 文字退回輸入框
    userRow.remove();
    inputEl.value = text;
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    inputEl.focus();
    addAIMsg('⚠️ 連線失敗：' + err.message + '\n\n您的訊息已退回輸入框，請確認 Worker URL 後重新發送。');
  } finally {
    isTyping = false;
    sendBtn.disabled = false;
  }
}

function quickSend(text) {
  // sendMessage 自己會清空輸入框，quickSend 只負責觸發
  sendMessage(text);
}

const inputEl = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');

inputEl.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

inputEl.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    const text = this.value.trim();
    if (text) sendMessage(text);
    // 不在這裡清空：sendMessage 自己管理
  }
});

sendBtn.addEventListener('click', function() {
  const text = inputEl.value.trim();
  if (text) sendMessage(text);
});

  } else {

  quickSend(prompt);

  document.getElementById('custom-master-input').value = cfg.customMaster;
  document.getElementById('custom-input-group').style.display = cfg.master === 'custom' ? 'block' : 'none';
  document.getElementById('modal-bg').classList.add('show');
}

function closeModal() {
  document.getElementById('modal-bg').classList.remove('show');
}

// Master Chip 選擇
document.getElementById('master-chips').addEventListener('click', function(e) {
  const chip = e.target.closest('.master-chip[data-key]');
  if (!chip) return;
  document.querySelectorAll('.master-chip[data-key]').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  cfg.master = chip.dataset.key;
  document.getElementById('custom-input-group').style.display = cfg.master === 'custom' ? 'block' : 'none';
});

// Style Chip 選擇
document.getElementById('style-chips').addEventListener('click', function(e) {
  const chip = e.target.closest('.master-chip[data-style]');
  if (!chip) return;
  document.querySelectorAll('.master-chip[data-style]').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  cfg.style = chip.dataset.style;
});

// 儲存
document.getElementById('save-btn').addEventListener('click', function() {
  cfg.workerUrl = document.getElementById('worker-url-input').value.trim() || DEFAULTS.workerUrl;
  cfg.customMaster = document.getElementById('custom-master-input').value.trim();
  saveCfg();
  applyMasterUI();
  // 重置對話（切換上師後重置）
  chatHistory = [];
  renderWelcome();
  document.getElementById('quick-btns').classList.remove('show');
  closeModal();
});
